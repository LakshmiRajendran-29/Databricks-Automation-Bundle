# This is a Databricks asset bundle definition for dab_analytics_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_analytics_bundle
  uuid: 2a5cf414-bd57-4cb1-9a70-dfe70b503cce

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4caa6f0f-62d0.cloud.databricks.com
    variables:
      catalog: dab_analytics_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-4caa6f0f-62d0.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/lakshmiranil@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lakshmiranil@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_analytics_dev
      schema: rnd
    permissions:
      - user_name: lakshmiranil@gmail.com
        level: CAN_MANAGE
